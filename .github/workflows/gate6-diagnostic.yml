name: Bounded Gate 6 buffered passive capture
# October 18 authorized single execution; stop after diagnostic closeout.
on:
  push:
    branches: [codex/stage-12-routing]
    paths: [Scripts/diagnose_gate6.py, Scripts/run_gate6_buffered.py, Scripts/gate6_accounting.py, Scripts/gate6_invocation.py, .github/workflows/gate6-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  input-boundaries:
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[record-only]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Start absolute experiment budget
        run: echo "GATE6_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate actual recorder and decoder before Simulator allocation
        run: |
          set -euo pipefail
          mkdir -p TestResults/selftest
          printf '{"jobs_allocated":1,"simulator_boot_requests":0,"simulator_boots_completed":0}\n' > TestResults/allocation.json
          git rev-parse HEAD > TestResults/exact-sha.txt
          { xcodebuild -version; swift --version; sw_vers; uname -a; } > TestResults/toolchain.txt 2>&1
          xcodebuild -help > TestResults/xcodebuild-help.txt 2>&1
          python3 Scripts/gate6_invocation.py TestResults/xcodebuild-help.txt > TestResults/invocation-options.log 2>&1
          python3 Scripts/test_gate6_invocation.py > TestResults/invocation-selftest.log 2>&1
          python3 Scripts/test_gate6_runner.py > TestResults/runner-selftest.log 2>&1
          python3 Scripts/test_gate6_buffer.py > TestResults/decoder-selftest.log 2>&1
          python3 Scripts/test_gate6_accounting.py > TestResults/accounting-selftest.log 2>&1
          python3 Scripts/test_gate6_instrumentation.py > TestResults/instrumentation-selftest.log 2>&1
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Scripts/Gate6Recorder.swift Scripts/gate6_recorder_selftest.swift -o "$RUNNER_TEMP/recorder-check" > TestResults/writer-compile.log 2>&1
          "$RUNNER_TEMP/recorder-check" "$PWD/TestResults/selftest" > TestResults/writer-selftest.log 2>&1
          python3 Scripts/gate6_writer_check.py TestResults/selftest >> TestResults/writer-selftest.log 2>&1
      - name: Install pinned XcodeGen
        run: bash Scripts/install_xcodegen.sh
      - name: Instrument and compile selected-Xcode app and UI runner before boot
        run: |
          set -euo pipefail
          python3 -c 'import os, time; assert time.time() < float(os.environ["GATE6_START"])+25*60-15, "test budget expired"'
          python3 Scripts/diagnose_gate6.py
          git add -N PuzzleAlarm/App/Gate6Recorder.swift PuzzleAlarm/App/Gate6InputProbe.swift
          git diff --binary > TestResults/ci-instrumentation.patch
          cp PuzzleAlarm/App/Gate6*.swift TestResults/
          xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > TestResults/devices.json
          xcrun simctl list runtimes --json > TestResults/runtimes.json
          simulator_id="$(python3 Scripts/select_simulator.py TestResults/devices.json TestResults/runtimes.json 26.0)"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          python3 - "$simulator_id" <<'PYBUILD'
          import os, signal, subprocess, sys, time
          remaining = float(os.environ['GATE6_START'])+25*60-15-time.time()
          if remaining <= 0: raise SystemExit('preboot build budget expired')
          args = ['xcodebuild', '-project', 'PuzzleAlarm.xcodeproj', '-scheme', 'PuzzleAlarm',
                  '-configuration', 'Debug', '-destination', 'generic/platform=iOS Simulator',
                  '-derivedDataPath', 'DerivedData', '-resultBundlePath', 'TestResults/preboot-build.xcresult',
                  'CODE_SIGNING_ALLOWED=NO', 'build-for-testing']
          with open('TestResults/preboot-build.log', 'w') as log:
              process = subprocess.Popen(args, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  code = process.wait(timeout=remaining)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGINT)
                  try: process.wait(timeout=8)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  raise SystemExit('preboot build deadline reached; no boot permitted')
              if code: raise SystemExit(code)
          PYBUILD
      - name: Boot selected Simulator once after validated compilation
        run: |
          set -euo pipefail
          simulator_id="$SIMULATOR_ID"
          python3 - "$simulator_id" <<'PYBOOT'
          import json, os, subprocess, sys, time
          from pathlib import Path
          p = Path('TestResults/allocation.json')
          allocation = json.loads(p.read_text())
          allocation.update(simulator_id=sys.argv[1], simulator_boot_requests=1)
          p.write_text(json.dumps(allocation, indent=2))
          subprocess.run(['xcrun', 'simctl', 'bootstatus', sys.argv[1], '-b'], check=True, timeout=max(1, float(os.environ['GATE6_START'])+25*60-15-time.time()))
          allocation['simulator_boots_completed'] = 1
          p.write_text(json.dumps(allocation, indent=2))
          PYBOOT
      - name: One original editor declaration once; stop after this diagnostic
        run: python3 Scripts/run_gate6_buffered.py
      - name: Export complete xcresults and activity records
        if: always()
        run: |
          mkdir -p TestResults
          for name in editor; do
            if [ -d "TestResults/$name.xcresult" ]; then
              xcrun xcresulttool get test-results tests --path "TestResults/$name.xcresult" > "TestResults/$name-tests.json" 2> "TestResults/$name-export-errors.log" || true
              xcrun xcresulttool export attachments --path "TestResults/$name.xcresult" --output-path "TestResults/$name-attachments" >> "TestResults/$name-export-errors.log" 2>&1 || true
            fi
          done
          if [ -d DerivedData/Logs ]; then cp -R DerivedData/Logs TestResults/activity-logs; fi
          # Fallback preservation if the runner/export was interrupted. These
          # bytes may be nonquiescent and never imply complete capture.
          python3 - <<'PYRAW'
          import os, shutil
          from pathlib import Path
          simulator = os.environ.get('SIMULATOR_ID')
          if simulator:
              source = Path.home() / 'Library/Developer/CoreSimulator/Devices' / simulator / 'data/Containers/Data/Application'
              for raw in source.glob('*/tmp/gate6-*.bin'):
                  target = Path('TestResults/raw-fallback') / raw.parent.parent.name / raw.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(raw, target)
          PYRAW
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('TestResults/outcome-manifest.json')
          if not p.exists():
              p.write_text(json.dumps(dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], outcome='TOOLING_FAILURE', actual_test_executions=0, xcodebuild_ui_invocations=0, complete_capture=False, negative_conclusion_allowed=False, gates='6–12 HELD'), indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate6-buffered-passive-capture
          path: TestResults
          retention-days: 7
