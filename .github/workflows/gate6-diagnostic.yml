name: Bounded Gate 6 buffered passive capture
on:
  push:
    branches: [codex/stage-12-routing]
    paths: [Scripts/diagnose_gate6.py, .github/workflows/gate6-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  input-boundaries:
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[record-only]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate actual recorder and decoder before Simulator allocation
        run: |
          set -euo pipefail
          mkdir -p TestResults/selftest
          git rev-parse HEAD > TestResults/exact-sha.txt
          { xcodebuild -version; swift --version; sw_vers; uname -a; } > TestResults/toolchain.txt 2>&1
          python3 Scripts/test_gate6_buffer.py > TestResults/decoder-selftest.log 2>&1
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Scripts/Gate6Recorder.swift Scripts/gate6_recorder_selftest.swift -o "$RUNNER_TEMP/recorder-check" > TestResults/writer-compile.log 2>&1
          "$RUNNER_TEMP/recorder-check" "$PWD/TestResults/selftest" > TestResults/writer-selftest.log 2>&1
          python3 Scripts/gate6_writer_check.py TestResults/selftest >> TestResults/writer-selftest.log 2>&1
      - name: Install pinned XcodeGen
        run: bash Scripts/install_xcodegen.sh
      - name: Instrument ephemeral checkout and boot Simulator
        run: |
          set -euo pipefail
          python3 -c 'import time; assert time.time() < 1792281273, "test budget expired"'
          python3 Scripts/diagnose_gate6.py
          git add -N PuzzleAlarm/App/Gate6Recorder.swift PuzzleAlarm/App/Gate6InputProbe.swift
          git diff --binary > TestResults/ci-instrumentation.patch
          cp PuzzleAlarm/App/Gate6*.swift TestResults/
          xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > TestResults/devices.json
          xcrun simctl list runtimes --json > TestResults/runtimes.json
          simulator_id="$(python3 Scripts/select_simulator.py TestResults/devices.json TestResults/runtimes.json 26.0)"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          python3 - "$simulator_id" <<'PYBOOT'
          import subprocess, sys, time
          subprocess.run(['xcrun', 'simctl', 'bootstatus', sys.argv[1], '-b'], check=True, timeout=max(1, 1792281273-time.time()))
          PYBOOT
      - name: One declaration each, sequential; stop at first failure or deadline
        run: python3 Scripts/run_gate6_buffered.py
      - name: Export complete xcresults and activity records
        if: always()
        run: |
          mkdir -p TestResults
          for name in toggle editor; do
            if [ -d "TestResults/$name.xcresult" ]; then
              xcrun xcresulttool get test-results tests --path "TestResults/$name.xcresult" > "TestResults/$name-tests.json" 2> "TestResults/$name-export-errors.log" || true
              xcrun xcresulttool export attachments --path "TestResults/$name.xcresult" --output-path "TestResults/$name-attachments" >> "TestResults/$name-export-errors.log" 2>&1 || true
            fi
          done
          if [ -d DerivedData/Logs ]; then cp -R DerivedData/Logs TestResults/activity-logs; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('TestResults/outcome-manifest.json')
          if not p.exists():
              p.write_text(json.dumps(dict(sha=os.environ['GITHUB_SHA'], outcome='SETUP_OR_INSTRUMENTATION_FAILURE', complete_capture=False, negative_conclusion_allowed=False, gates='6–12 HELD'), indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate6-buffered-passive-capture
          path: TestResults
          retention-days: 7
