name: PuzzleAlarm Core and iOS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzlealarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toggle-reproduction:
    # Focused diagnostic evidence is available before the full ordered gate job.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: bash Scripts/install_xcodegen.sh
      - name: Generate project and select iPhone Simulator
        run: |
          xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          simulator_id="$(python3 Scripts/select_simulator.py "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/runtimes.json" 26.0)"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Wait for selected Simulator boot readiness
        run: |
          xcrun simctl help bootstatus
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl list devices booted
      - name: Verify retained alarm binding follows owner state
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/EnabledBinding.xcresult \
            -only-testing:PuzzleAlarmTests/AlarmStoreTests/testAlarmListBindingTracksOwnerStateAndRemovalWithoutRebuilding \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/enabled-binding-tests.log"
      - name: Reproduce Gate 6 enable failure and retry
        id: enable_flow
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Toggle.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests/testEnableDisableAndFailureRetryAreHonest \
            -test-iterations 10 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/toggle-ui-tests.log"
      - name: Compare native editor draft binding
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/EditorToggle.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests/testEditorEnabledTogglePersistsAfterRepeatedNativeInput \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/editor-toggle-ui-tests.log"
      - name: Preserve binding and owner input trace
        if: always()
        run: |
          set -euo pipefail
          # Xcode may execute in clones and shut them down before this step.
          # Read journals from this ephemeral runner's Simulator data containers.
          python3 - <<'PY'
          from pathlib import Path
          files = list((Path.home() / "Library/Developer/CoreSimulator/Devices").glob(
              "*/data/Containers/Data/Application/*/tmp/toggle-input-diagnostic.log"))
          if not files:
              if "${{ steps.enable_flow.outcome }}" == "skipped":
                  print("Owner flow skipped after earlier failure; no owner journal expected.")
                  raise SystemExit(0)
              raise SystemExit("No fixture input journal found in Simulator containers")
          output = Path("TestResults/toggle-input-diagnostic.log")
          output.write_text("\n".join(str(file) + "\n" + file.read_text() for file in files))
          print(output.read_text())
          PY
      - name: Review diagnostic Xcode warnings
        run: python3 Scripts/check_xcode_diagnostics.py "$RUNNER_TEMP/toggle-ui-tests.log" "$RUNNER_TEMP/editor-toggle-ui-tests.log" "$RUNNER_TEMP/enabled-binding-tests.log"
      - name: Preserve focused toggle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toggle-simulator-evidence
          path: |
            TestResults/Toggle.xcresult
            TestResults/EditorToggle.xcresult
            TestResults/EnabledBinding.xcresult
            TestResults/toggle-input-diagnostic.log
          if-no-files-found: ignore
          retention-days: 7
  validate:
    needs: toggle-reproduction
    # Standard public-repository runner; no larger runners or signing credentials.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain evidence
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Install pinned XcodeGen
        run: bash Scripts/install_xcodegen.sh
      - name: Generate reproducible Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml
          cp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          xcodegen generate --spec project.yml
          cmp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cmp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cmp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          test -z "$(git ls-files '*.xcodeproj/*' '.generated/*')"
      - name: Validate package manifest
        run: swift package dump-package
      - name: Verify reproducible generated audio resources
        run: python3 Scripts/generate_alarm_sounds.py --check
      - name: Build PuzzleAlarmCore
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run focused persistence tests
        run: swift test -Xswiftc -warnings-as-errors --filter Persistence
      - name: Run focused coverage-audit regressions
        run: swift test -Xswiftc -warnings-as-errors --filter 'weeklyOccurrenceSurvivesSkippedLocalCalendarDate|completedReloadPreservesTerminalStateUnderLateEvents'
      - name: Run focused lifecycle tests
        run: swift test -Xswiftc -warnings-as-errors --filter Lifecycle
      - name: Run focused challenge coordinator tests
        run: swift test -Xswiftc -warnings-as-errors --filter ChallengeCoordinator
      - name: Run focused Math engine tests
        run: swift test -Xswiftc -warnings-as-errors --filter MathEngine
      - name: Run focused Memory engine tests
        run: swift test -Xswiftc -warnings-as-errors --filter MemoryEngine
      - name: Run focused QR engine and owner tests
        run: swift test -Xswiftc -warnings-as-errors --filter 'QREngine|QRLifecycle'
      - name: Run full Swift package tests
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage
      - name: Report core coverage
        run: python3 Scripts/report_core_coverage.py "$(swift test --show-codecov-path)"
      - name: Report exact uncovered core lines
        run: python3 Scripts/report_uncovered_lines.py
      - name: Discover compatible iPhone Simulator
        id: simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm -showdestinations
          simulator_id="$(python3 Scripts/select_simulator.py "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/runtimes.json" 26.0)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Wait for regression Simulator boot readiness
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build iOS application for Simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Build Release without UI-test fixtures
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath ReleaseDerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/ios-release.log"
      - name: Verify built AlarmKit usage description
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          path = pathlib.Path("DerivedData/Build/Products/Debug-iphonesimulator/PuzzleAlarm.app/Info.plist")
          value = plistlib.loads(path.read_bytes()).get("NSAlarmKitUsageDescription")
          if not isinstance(value, str) or not value.strip():
              raise SystemExit("Built app is missing NSAlarmKitUsageDescription")
          print(f"Built app usage description: {value}")
          camera = plistlib.loads(path.read_bytes()).get("NSCameraUsageDescription")
          if not isinstance(camera, str) or not camera.strip():
              raise SystemExit("Built app is missing NSCameraUsageDescription")
          print(f"Built camera usage description: {camera}")
          photos = plistlib.loads(path.read_bytes()).get("NSPhotoLibraryAddUsageDescription")
          if not isinstance(photos, str) or not photos.strip():
              raise SystemExit("Built app is missing NSPhotoLibraryAddUsageDescription")
          print(f"Built QR image save usage description: {photos}")
          PY
      - name: Run focused audio tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Audio.xcresult \
            -only-testing:PuzzleAlarmTests/AudioTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/audio-tests.log"
      - name: Run focused QR application and scanner tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/QRApplication.xcresult \
            -only-testing:PuzzleAlarmTests/QRStoreTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/qr-application-tests.log"
      - name: Run focused application state and draft tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Application.xcresult \
            -only-testing:PuzzleAlarmTests/AlarmStoreTests -only-testing:PuzzleAlarmTests/AlarmEditorDraftTests \
            -only-testing:PuzzleAlarmTests/MathStoreTests \
            -only-testing:PuzzleAlarmTests/MemoryStoreTests \
            -only-testing:PuzzleAlarmTests/QRStoreTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/application-tests.log"
      - name: Replay Gate 6 management UI before downstream flows
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Management.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/management-ui-tests.log"
      - name: Run focused Math UI smoke flow
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Math.xcresult \
            -only-testing:PuzzleAlarmUITests/MathChallengeUITests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/math-ui-tests.log"
      - name: Run focused Memory UI smoke flow
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Memory.xcresult \
            -only-testing:PuzzleAlarmUITests/MemoryChallengeUITests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/memory-ui-tests.log"
      - name: Run focused QR UI flows
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/QR.xcresult \
            -only-testing:PuzzleAlarmUITests/QRChallengeUITests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/qr-ui-tests.log"
      - name: Run platform capability and native shell tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Shell.xcresult \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      - name: Report application behavior coverage
        if: always()
        run: |
          xcrun xccov view --report --json TestResults/Shell.xcresult > "$RUNNER_TEMP/app-coverage.json"
          python3 Scripts/report_app_coverage.py "$RUNNER_TEMP/app-coverage.json"
      - name: Verify Release excludes UI-test switches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          binary = Path("ReleaseDerivedData/Build/Products/Release-iphonesimulator/PuzzleAlarm.app/PuzzleAlarm").read_bytes()
          for marker in [b"toggle-input-diagnostic.log", b"PUZZLE_UI_TEST", b"simulated-system.json", b"TestAlarmScheduler", b"FakeQRCodeScanner", b"Simulate matching QR"]:
              if marker in binary:
                  raise SystemExit("DEBUG fixture leaked into Release: " + marker.decode())
          print("Release contains no UI-test switches, fake scheduler or simulated-system storage.")
          PY
      - name: Review Xcode diagnostics
        run: python3 Scripts/check_xcode_diagnostics.py "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/ios-tests.log" "$RUNNER_TEMP/ios-release.log" "$RUNNER_TEMP/audio-tests.log" "$RUNNER_TEMP/qr-application-tests.log" "$RUNNER_TEMP/application-tests.log" "$RUNNER_TEMP/management-ui-tests.log" "$RUNNER_TEMP/math-ui-tests.log" "$RUNNER_TEMP/memory-ui-tests.log" "$RUNNER_TEMP/qr-ui-tests.log"
      - name: Preserve QR Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-simulator-evidence
          path: TestResults/QR.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-simulator-evidence
          path: |
            TestResults/Audio.xcresult
            TestResults/QRApplication.xcresult
            TestResults/Application.xcresult
            TestResults/Management.xcresult
            TestResults/Shell.xcresult
          if-no-files-found: ignore
          retention-days: 7
