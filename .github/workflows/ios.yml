name: PuzzleAlarm Core and iOS
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation scope (focused profiles are checkpoint evidence only)
        type: choice
        options: [full, 6a_identity, 6a_menu, 6a, 6b, 6c, 6d_settings, 6d_sequence, 6d_modes]
        default: full

permissions:
  contents: read

concurrency:
  group: puzzlealarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Standard public-repository runner; no larger runners or signing credentials.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # Inspect the submitted history, not GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify fixed restart lineage
        run: python3 Scripts/check_restart_lineage.py
      - name: Record toolchain evidence
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Install pinned XcodeGen
        run: bash Scripts/install_xcodegen.sh
      - name: Generate reproducible Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml
          cp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          xcodegen generate --spec project.yml
          cmp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cmp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cmp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          test -z "$(git ls-files '*.xcodeproj/*' '.generated/*')"
      - name: Validate package manifest
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift package dump-package
      - name: Build PuzzleAlarmCore
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run focused persistence tests
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift test -Xswiftc -warnings-as-errors --filter Persistence
      - name: Run focused coverage-audit regressions
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift test -Xswiftc -warnings-as-errors --filter 'weeklyOccurrenceSurvivesSkippedLocalCalendarDate|completedReloadPreservesTerminalStateUnderLateEvents'
      - name: Run focused lifecycle tests
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift test -Xswiftc -warnings-as-errors --filter Lifecycle
      - name: Run Swift package tests
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage
      - name: Report core coverage
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: python3 Scripts/report_core_coverage.py "$(swift test --show-codecov-path)"
      - name: Report exact uncovered core lines
        if: inputs.profile != '6a' && inputs.profile != '6b' && inputs.profile != '6a_identity' && inputs.profile != '6c' && inputs.profile != '6a_menu' && inputs.profile != '6d_settings' && inputs.profile != '6d_sequence' && inputs.profile != '6d_modes'
        run: python3 Scripts/report_uncovered_lines.py
      - name: Discover compatible iPhone Simulator
        id: simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm -showdestinations
          simulator_id="$(python3 Scripts/select_simulator.py "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/runtimes.json" 26.0)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build iOS application for Simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Verify built AlarmKit usage description
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          path = pathlib.Path("DerivedData/Build/Products/Debug-iphonesimulator/PuzzleAlarm.app/Info.plist")
          value = plistlib.loads(path.read_bytes()).get("NSAlarmKitUsageDescription")
          if not isinstance(value, str) or not value.strip():
              raise SystemExit("Built app is missing NSAlarmKitUsageDescription")
          print(f"Built app usage description: {value}")
          PY
      - name: Run platform capability and native shell tests
        # Leave time to freeze/upload evidence even when the test command stalls.
        timeout-minutes: 18
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          selectors=(-skip-testing:PuzzleAlarmUITests/HarnessDiagnosticsUITests)
          if [[ "${{ inputs.profile }}" == "6a" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmUITests/HarnessIdentityUITests
              -only-testing:PuzzleAlarmUITests/HarnessPickerUITests
              -only-testing:PuzzleAlarmUITests/HarnessMenuUITests
              -only-testing:PuzzleAlarmUITests/HarnessDiagnosticsUITests)
          elif [[ "${{ inputs.profile }}" == "6a_identity" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmUITests/HarnessIdentityUITests
              -only-testing:PuzzleAlarmUITests/HarnessDiagnosticsUITests/testNativeWaitReportsAbsentControl)
          elif [[ "${{ inputs.profile }}" == "6a_menu" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmUITests/HarnessMenuUITests
              -only-testing:PuzzleAlarmUITests/DraftEditingUITests/testSavedTimeAndSoundReopenFromDisk)
          elif [[ "${{ inputs.profile }}" == "6b" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmTests/AlarmManagementTests/testListEmptyAndReadyStatesUseAuthoritativeDefinitions
              -only-testing:PuzzleAlarmTests/AlarmManagementTests/testBusyModelRejectsOverlappingCommands
              -only-testing:PuzzleAlarmTests/AlarmManagementTests/testCorruptDiskFailsClosedWithoutReplacingData
              -only-testing:PuzzleAlarmUITests/HarnessIdentityUITests
              -only-testing:PuzzleAlarmUITests/HarnessPickerUITests
              -only-testing:PuzzleAlarmUITests/ListNavigationUITests)
          elif [[ "${{ inputs.profile }}" == "6c" ]]; then
            # 6A then the complete unchanged 6B set must already have succeeded.
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmTests/DraftEditingTests
              -only-testing:PuzzleAlarmUITests/DraftEditingUITests)
          elif [[ "${{ inputs.profile }}" == "6d_settings" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmTests/ChallengeConfigurationTests
              -only-testing:PuzzleAlarmUITests/ChallengeSettingsUITests)
          elif [[ "${{ inputs.profile }}" == "6d_sequence" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmTests/ChallengeConfigurationTests
              -only-testing:PuzzleAlarmUITests/ChallengeSequenceUITests)
          elif [[ "${{ inputs.profile }}" == "6d_modes" ]]; then
            selectors=(-only-testing:PuzzleAlarmTests/SimulatorUITestFixtureTests
              -only-testing:PuzzleAlarmTests/ChallengeConfigurationTests
              -only-testing:PuzzleAlarmUITests/ChallengeModeUITests)
          fi
          printf 'Assessed SHA: %s; profile: %s\n' "$GITHUB_SHA" "${{ inputs.profile || 'full' }}"
          printf 'Test selector: %s\n' "${selectors[@]}"
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Shell.xcresult \
            "${selectors[@]}" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      - name: Review Xcode diagnostics
        run: python3 Scripts/check_xcode_diagnostics.py "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/ios-tests.log"
      - name: Freeze Xcode evidence outside the live diagnostic workspace
        if: always()
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s Scripts/tests -p test_preserve_xcode_results.py
          python3 Scripts/preserve_xcode_results.py TestResults/Shell.xcresult TestResults/Preserved \
            "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/ios-tests.log"
      - name: Preserve Xcode results and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-${{ github.sha }}-${{ inputs.profile || 'full' }}
          path: TestResults/Preserved/
          if-no-files-found: error
          retention-days: 90
