name: PuzzleAlarm Core and iOS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzlealarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerequisites:
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[record-only]') && !contains(github.event.head_commit.message, '[gate6-diagnostic]') && ((github.ref != 'refs/heads/codex/stage-14-resilience' && github.head_ref != 'codex/stage-14-resilience') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/stage-14-resilience' && contains(github.event.head_commit.message, '[stage14-validation]'))) && ((github.ref != 'refs/heads/codex/gate6-controlled-reset' && github.head_ref != 'codex/gate6-controlled-reset') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/gate6-controlled-reset' && contains(github.event.head_commit.message, '[gate6-acceptance]')))
    strategy:
      fail-fast: true
      matrix:
        include:
          - {lane: list, ceiling: 40, minutes: 34}
          - {lane: editor, ceiling: 25, minutes: 19}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.ceiling }}
    env:
      ACCEPTANCE_MINUTES: ${{ matrix.minutes }}
    steps:
      - name: Start absolute budget and verify frozen candidate
        run: |
          echo "ACCEPTANCE_START=$(date +%s)" >> "$GITHUB_ENV"
          test -n "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          python3 Scripts/run_acceptance_step.py verify-exact-checkout <<'ACCEPTANCE_STEP'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ACCEPTANCE_STEP
      - name: Record toolchain and install pinned generator
        timeout-minutes: 4
        run: |
          python3 Scripts/run_acceptance_step.py record-toolchain-and-install-pinned-generator <<'ACCEPTANCE_STEP'
          mkdir -p TestResults
          { sw_vers; xcodebuild -version; swift --version; } > TestResults/toolchain.log
          bash Scripts/install_xcodegen.sh
          ACCEPTANCE_STEP
      - name: Generate and boot independent Simulator
        timeout-minutes: 5
        run: |
          python3 Scripts/run_acceptance_step.py generate-and-boot-independent-simulator <<'ACCEPTANCE_STEP'
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          simulator_id="$(python3 Scripts/select_simulator.py "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/runtimes.json" 26.0)"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b
          ACCEPTANCE_STEP
      - name: Focused owner and input contracts
        if: matrix.lane == 'list'
        run: |
          python3 Scripts/run_acceptance_step.py focused-owner-and-input-contracts <<'ACCEPTANCE_STEP'
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Contracts.xcresult \
            -only-testing:PuzzleAlarmTests/AlarmStoreTests \
            -only-testing:PuzzleAlarmTests/AlarmEnabledInputTests \
            -only-testing:PuzzleAlarmTests/AlarmEditorDraftTests \
            -only-testing:PuzzleAlarmTests/PersistenceIntegrationTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          ACCEPTANCE_STEP
      - name: Ten unchanged ordinary list flows
        id: ten_list
        if: matrix.lane == 'list'
        run: |
          python3 Scripts/run_acceptance_step.py ten-unchanged-ordinary-list-flows <<'ACCEPTANCE_STEP'
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/TenList.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests/testEnableDisableAndFailureRetryAreHonest \
            -run-tests-until-failure -test-iterations 10 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building
          ACCEPTANCE_STEP
      - name: Unchanged independent editor declaration
        if: matrix.lane == 'editor'
        run: |
          python3 Scripts/run_acceptance_step.py unchanged-independent-editor-declaration <<'ACCEPTANCE_STEP'
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Editor.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests/testEditorEnabledTogglePersistsAfterRepeatedNativeInput \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          ACCEPTANCE_STEP
      - name: Review Xcode warnings
        run: |
          python3 Scripts/run_acceptance_step.py review-xcode-warnings <<'ACCEPTANCE_STEP'
          python3 Scripts/check_xcode_diagnostics.py TestResults/toolchain.log TestResults/acceptance-steps/*.log
          ACCEPTANCE_STEP
      - name: Preserve available ordinary fixture journals
        if: always()
        run: |
          mkdir -p TestResults
          python3 - <<'PY'
          from pathlib import Path
          files = list((Path.home() / "Library/Developer/CoreSimulator/Devices").glob(
              "*/data/Containers/Data/Application/*/tmp/toggle-input-diagnostic.log"))
          if not files and "${{ matrix.lane }}" == "list" and "${{ steps.ten_list.outcome }}" not in ("skipped", "cancelled"):
              raise SystemExit("No fixture input journal found in Simulator containers")
          Path("TestResults/existing-fixture-journals.log").write_text(
              "\n".join(str(p) + "\n" + p.read_text(errors="replace") for p in files))
          PY
      - name: Preserve original results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.lane }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30
  validate:
    needs: [prerequisites]
    # Standard public-repository runner; no larger runners or signing credentials.
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[record-only]') && !contains(github.event.head_commit.message, '[gate6-diagnostic]') && ((github.ref != 'refs/heads/codex/stage-14-resilience' && github.head_ref != 'codex/stage-14-resilience') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/stage-14-resilience' && contains(github.event.head_commit.message, '[stage14-validation]'))) && ((github.ref != 'refs/heads/codex/gate6-controlled-reset' && github.head_ref != 'codex/gate6-controlled-reset') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/gate6-controlled-reset' && contains(github.event.head_commit.message, '[gate6-acceptance]')))
    runs-on: macos-26
    timeout-minutes: 85
    env:
      ACCEPTANCE_MINUTES: 79
    steps:
      - name: Start absolute acceptance budget
        run: |
          echo "ACCEPTANCE_START=$(date +%s)" >> "$GITHUB_ENV"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain evidence
        run: |
          python3 Scripts/run_acceptance_step.py record-toolchain-evidence <<'ACCEPTANCE_STEP'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          ACCEPTANCE_STEP
      - name: Install pinned XcodeGen
        run: |
          python3 Scripts/run_acceptance_step.py install-pinned-xcodegen <<'ACCEPTANCE_STEP'
          bash Scripts/install_xcodegen.sh
          ACCEPTANCE_STEP
      - name: Generate reproducible Xcode project
        run: |
          python3 Scripts/run_acceptance_step.py generate-reproducible-xcode-project <<'ACCEPTANCE_STEP'
          xcodegen --version
          xcodegen generate --spec project.yml
          cp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          xcodegen generate --spec project.yml
          cmp PuzzleAlarm.xcodeproj/project.pbxproj "$RUNNER_TEMP/first-project.pbxproj"
          cmp PuzzleAlarm.xcodeproj/xcshareddata/xcschemes/PuzzleAlarm.xcscheme "$RUNNER_TEMP/first-scheme.xcscheme"
          cmp .generated/PuzzleAlarm-Info.plist "$RUNNER_TEMP/first-info.plist"
          test -z "$(git ls-files '*.xcodeproj/*' '.generated/*')"
          ACCEPTANCE_STEP
      - name: Validate package manifest
        run: |
          python3 Scripts/run_acceptance_step.py validate-package-manifest <<'ACCEPTANCE_STEP'
          swift package dump-package
          ACCEPTANCE_STEP
      - name: Build PuzzleAlarmCore
        run: |
          python3 Scripts/run_acceptance_step.py build-puzzlealarmcore <<'ACCEPTANCE_STEP'
          swift build -Xswiftc -warnings-as-errors
          ACCEPTANCE_STEP
      - name: Run focused persistence tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-persistence-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter Persistence
          ACCEPTANCE_STEP
      - name: Run focused coverage-audit regressions
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-coverage-audit-regressions <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter 'weeklyOccurrenceSurvivesSkippedLocalCalendarDate|completedReloadPreservesTerminalStateUnderLateEvents'
          ACCEPTANCE_STEP
      - name: Run focused lifecycle tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-lifecycle-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter Lifecycle
          ACCEPTANCE_STEP
      - name: Discover compatible iPhone Simulator
        id: simulator
        run: |
          python3 Scripts/run_acceptance_step.py discover-compatible-iphone-simulator <<'ACCEPTANCE_STEP'
          xcrun simctl list devices available
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm -showdestinations
          simulator_id="$(python3 Scripts/select_simulator.py "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/runtimes.json" 26.0)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          ACCEPTANCE_STEP
      - name: Wait for regression Simulator boot readiness
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py wait-for-regression-simulator-boot-readiness <<'ACCEPTANCE_STEP'
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          ACCEPTANCE_STEP
      - name: Build iOS application for Simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py build-ios-application-for-simulator <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          ACCEPTANCE_STEP
      - name: Run focused application state and draft tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-application-state-and-draft-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Application.xcresult \
            -only-testing:PuzzleAlarmTests/AlarmStoreTests -only-testing:PuzzleAlarmTests/AlarmEditorDraftTests \
            -only-testing:PuzzleAlarmTests/AlarmEnabledInputTests \
            -only-testing:PuzzleAlarmTests/PersistenceIntegrationTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/application-tests.log"
          ACCEPTANCE_STEP
      - name: Replay Gate 6 management UI before downstream flows
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py replay-gate-6-management-ui-before-downstream-flows <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Management.xcresult \
            -only-testing:PuzzleAlarmUITests/AlarmManagementUITests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/management-ui-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused challenge coordinator tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-challenge-coordinator-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter ChallengeCoordinator
          ACCEPTANCE_STEP
      - name: Run focused Math engine tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-math-engine-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter MathEngine
          ACCEPTANCE_STEP
      - name: Run focused Math application tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-math-application-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/MathApplication.xcresult \
            -only-testing:PuzzleAlarmTests/MathStoreTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/math-application-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused Math UI smoke flow
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-math-ui-smoke-flow <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Math.xcresult \
            -only-testing:PuzzleAlarmUITests/MathChallengeUITests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/math-ui-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused Memory engine tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-memory-engine-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter MemoryEngine
          ACCEPTANCE_STEP
      - name: Run focused Memory application tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-memory-application-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/MemoryApplication.xcresult \
            -only-testing:PuzzleAlarmTests/MemoryStoreTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/memory-application-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused Memory UI smoke flow
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-memory-ui-smoke-flow <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Memory.xcresult \
            -only-testing:PuzzleAlarmUITests/MemoryChallengeUITests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/memory-ui-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused QR engine and owner tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-qr-engine-and-owner-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter 'QREngine|QRLifecycle'
          ACCEPTANCE_STEP
      - name: Run focused QR application and scanner tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-qr-application-and-scanner-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/QRApplication.xcresult \
            -only-testing:PuzzleAlarmTests/QRStoreTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/qr-application-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused QR UI flows
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-qr-ui-flows <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/QR.xcresult \
            -only-testing:PuzzleAlarmUITests/QRChallengeUITests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/qr-ui-tests.log"
          ACCEPTANCE_STEP
      - name: Verify reproducible generated audio resources
        run: |
          python3 Scripts/run_acceptance_step.py verify-reproducible-generated-audio-resources <<'ACCEPTANCE_STEP'
          python3 Scripts/generate_alarm_sounds.py --check
          ACCEPTANCE_STEP
      - name: Inspect public AlarmKit and App Intents declarations
        run: |
          python3 Scripts/run_acceptance_step.py inspect-public-alarmkit-and-app-intents-declarations <<'ACCEPTANCE_STEP'
          python3 Scripts/inspect_alarmkit_sdk.py
          ACCEPTANCE_STEP
      - name: Build Release without UI-test fixtures
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py build-release-without-ui-test-fixtures <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath ReleaseDerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/ios-release.log"
          ACCEPTANCE_STEP
      - name: Verify built AlarmKit usage description
        run: |
          python3 Scripts/run_acceptance_step.py verify-built-alarmkit-usage-description <<'ACCEPTANCE_STEP'
          python3 - <<'PY'
          import pathlib, plistlib
          path = pathlib.Path("DerivedData/Build/Products/Debug-iphonesimulator/PuzzleAlarm.app/Info.plist")
          value = plistlib.loads(path.read_bytes()).get("NSAlarmKitUsageDescription")
          if not isinstance(value, str) or not value.strip():
              raise SystemExit("Built app is missing NSAlarmKitUsageDescription")
          print(f"Built app usage description: {value}")
          camera = plistlib.loads(path.read_bytes()).get("NSCameraUsageDescription")
          if not isinstance(camera, str) or not camera.strip():
              raise SystemExit("Built app is missing NSCameraUsageDescription")
          print(f"Built camera usage description: {camera}")
          photos = plistlib.loads(path.read_bytes()).get("NSPhotoLibraryAddUsageDescription")
          if not isinstance(photos, str) or not photos.strip():
              raise SystemExit("Built app is missing NSPhotoLibraryAddUsageDescription")
          print(f"Built QR image save usage description: {photos}")
          PY
          ACCEPTANCE_STEP
      - name: Run focused audio tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-audio-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Audio.xcresult \
            -only-testing:PuzzleAlarmTests/AudioTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/audio-tests.log"
          ACCEPTANCE_STEP
      - name: Run focused deterministic wake-up routing tests
        run: |
          python3 Scripts/run_acceptance_step.py run-focused-deterministic-wake-up-routing-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --filter wakeUpRouting
          ACCEPTANCE_STEP
      - name: Verify Gate 12 App Intent and foreground routing
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py verify-gate-12-app-intent-and-foreground-routing <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Routing.xcresult \
            -only-testing:PuzzleAlarmTests/WakeUpRoutingTests \
            -only-testing:PuzzleAlarmUITests/WakeUpRoutingUITests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/routing-tests.log"
          ACCEPTANCE_STEP
      - name: Verify Gate 13 full orchestration A through J
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py verify-gate-13-full-orchestration-a-through-j <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Orchestration.xcresult \
            -only-testing:PuzzleAlarmTests/OrchestrationIntegrationTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/orchestration-tests.log"
          ACCEPTANCE_STEP
      - name: Verify Gate 14 resilience and failure injection
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py verify-gate-14-resilience-and-failure-injection <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Resilience.xcresult \
            -only-testing:PuzzleAlarmTests/ResilienceTests \
            -only-testing:PuzzleAlarmTests/QRStoreTests \
            -only-testing:PuzzleAlarmTests/AudioTests \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/resilience-tests.log"
          ACCEPTANCE_STEP
      - name: Run full Swift package tests
        run: |
          python3 Scripts/run_acceptance_step.py run-full-swift-package-tests <<'ACCEPTANCE_STEP'
          swift test -Xswiftc -warnings-as-errors --enable-code-coverage
          ACCEPTANCE_STEP
      - name: Report core coverage
        run: |
          python3 Scripts/run_acceptance_step.py report-core-coverage <<'ACCEPTANCE_STEP'
          python3 Scripts/report_core_coverage.py "$(swift test --show-codecov-path)"
          ACCEPTANCE_STEP
      - name: Report exact uncovered core lines
        run: |
          python3 Scripts/run_acceptance_step.py report-exact-uncovered-core-lines <<'ACCEPTANCE_STEP'
          python3 Scripts/report_uncovered_lines.py
          ACCEPTANCE_STEP
      - name: Run platform capability and native shell tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py run-platform-capability-and-native-shell-tests <<'ACCEPTANCE_STEP'
          set -o pipefail
          xcodebuild -project PuzzleAlarm.xcodeproj -scheme PuzzleAlarm \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Shell.xcresult \
            -parallel-testing-enabled NO -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
          ACCEPTANCE_STEP
      - name: Report application behavior coverage
        run: |
          python3 Scripts/run_acceptance_step.py report-application-behavior-coverage <<'ACCEPTANCE_STEP'
          xcrun xccov view --report --json TestResults/Shell.xcresult > "$RUNNER_TEMP/app-coverage.json"
          python3 Scripts/report_app_coverage.py "$RUNNER_TEMP/app-coverage.json"
          ACCEPTANCE_STEP
      - name: Verify Release excludes UI-test switches
        run: |
          python3 Scripts/run_acceptance_step.py verify-release-excludes-ui-test-switches <<'ACCEPTANCE_STEP'
          python3 - <<'PY'
          from pathlib import Path
          binary = Path("ReleaseDerivedData/Build/Products/Release-iphonesimulator/PuzzleAlarm.app/PuzzleAlarm").read_bytes()
          for marker in [b"toggle-input-diagnostic.log", b"PUZZLE_UI_TEST", b"simulated-system.json", b"TestAlarmScheduler", b"FakeQRCodeScanner", b"Simulate matching QR"]:
              if marker in binary:
                  raise SystemExit("DEBUG fixture leaked into Release: " + marker.decode())
          print("Release contains no UI-test switches, fake scheduler or simulated-system storage.")
          PY
          ACCEPTANCE_STEP
      - name: Review Xcode diagnostics
        run: |
          python3 Scripts/run_acceptance_step.py review-xcode-diagnostics <<'ACCEPTANCE_STEP'
          python3 Scripts/check_xcode_diagnostics.py "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/ios-tests.log" "$RUNNER_TEMP/ios-release.log" "$RUNNER_TEMP/audio-tests.log" "$RUNNER_TEMP/qr-application-tests.log" "$RUNNER_TEMP/application-tests.log" "$RUNNER_TEMP/math-application-tests.log" "$RUNNER_TEMP/memory-application-tests.log" "$RUNNER_TEMP/management-ui-tests.log" "$RUNNER_TEMP/math-ui-tests.log" "$RUNNER_TEMP/memory-ui-tests.log" "$RUNNER_TEMP/qr-ui-tests.log" "$RUNNER_TEMP/routing-tests.log" "$RUNNER_TEMP/orchestration-tests.log" "$RUNNER_TEMP/resilience-tests.log"
          ACCEPTANCE_STEP
      - name: Export Windows-friendly visual demo
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 Scripts/run_acceptance_step.py export-windows-friendly-visual-demo <<'ACCEPTANCE_STEP'
          python3 Scripts/export_visual_demo.py
          ACCEPTANCE_STEP
      - name: Publish PuzzleAlarm visual demo
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleAlarm-iPhone-Visual-Demo-${{ github.sha }}
          path: TestResults/PuzzleAlarm-Visual-Demo/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve QR Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-simulator-evidence
          path: TestResults/QR.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-simulator-evidence
          path: |
            TestResults/Audio.xcresult
            TestResults/Routing.xcresult
            TestResults/Orchestration.xcresult
            TestResults/Resilience.xcresult
            TestResults/QRApplication.xcresult
            TestResults/MathApplication.xcresult
            TestResults/MemoryApplication.xcresult
            TestResults/Math.xcresult
            TestResults/Memory.xcresult
            TestResults/Application.xcresult
            TestResults/Management.xcresult
            TestResults/Shell.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve complete acceptance step logs and budget records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-validation-logs
          path: |
            TestResults/acceptance-steps/
            TestResults/SDK/
          if-no-files-found: warn
          retention-days: 30
